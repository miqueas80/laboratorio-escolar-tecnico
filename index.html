<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS-X // QUANTUM CORE</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 6px;
            background-color: #161b22;
        }
        /* Pantalla de carga / Iniciando */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        .spinner {
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }
        input, button {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            font-family: inherit;
            border-radius: 4px;
        }
        button { cursor: pointer; background: #238636; color: #fff; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>

    <!-- Pantalla de Inicio / Bloqueo prevenido -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">NEXUS-X // Sincronizando...</div>
    </div>

    <div class="container">
        <h1>NEXUS-X // QUANTUM CORE</h1>
        <p>API Key: <input type="password" id="api-key" placeholder="GUARDAR"></p>
        <div id="status-core">> Núcleo listo. Ingresá un concepto (ej: óxidos, soluciones) para encontrar los manuales.</div>
        <br>
        <input type="text" id="search-input" placeholder="Buscar concepto...">
        <button onclick="ejecutarBusqueda()">BUSCAR</button>
    </div>

    <script>
        // ==========================================
        // SISTEMA DE ARRANQUE SEGURO Y ANTIBLOQUEOS
        // ==========================================
        (function() {
            const TIEMPO_LIMITE_INICIO = 3500; // 3.5 segundos máx de espera
            let sistemaCargado = false;

            // Failsafe: Si las librerías externas o IndexedDB fallan, esto destraba la UI por la fuerza
            const safetyTimer = setTimeout(() => {
                if (!sistemaCargado) {
                    console.warn("[NEXUS-X] Tiempo de espera agotado. Forzando inicio del núcleo...");
                    ocultarPantallaCarga(">> Núcleo iniciado (Modo de Recuperación)");
                    sistemaCargado = true;
                }
            }, TIEMPO_LIMITE_INICIO);

            window.ocultarPantallaCarga = function(mensajeEstado) {
                if (sistemaCargado && document.getElementById('loading-screen').classList.contains('hidden')) return;
                
                sistemaCargado = true;
                clearTimeout(safetyTimer);

                const pantalla = document.getElementById('loading-screen');
                if (pantalla) {
                    pantalla.classList.add('hidden');
                }

                if (mensajeEstado) {
                    const statusEl = document.getElementById('status-core');
                    if (statusEl) statusEl.innerText = mensajeEstado;
                }
                console.log("[NEXUS-X] Sistema inicializado correctamente.");
            };
        })();

        // Simulación de carga de módulos (Reemplaza o adapta esto con tus llamadas reales de PDF.js / Workers)
        window.addEventListener('DOMContentLoaded', () => {
            try {
                // Aquí irían tus inicializaciones (IndexedDB, lectura de archivos, etc.)
                setTimeout(() => {
                    // Llamada exitosa a cuando todo cargó bien
                    window.ocultarPantallaCarga(">> Núcleo listo. Ingresá un concepto (ej: óxidos, soluciones) para encontrar los manuales.");
                }, 800); // Simula el tiempo de carga real
            } catch (error) {
                console.error("[NEXUS-X Error de arranque]:", error);
                window.ocultarPantallaCarga(">> Error en el arranque, ejecutado en modo seguro.");
            }
        });

        function ejecutarBusqueda() {
            const query = document.getElementById('search-input').value;
            console.log("Buscando:", query);
        }
    </script>
</body>
</html>
