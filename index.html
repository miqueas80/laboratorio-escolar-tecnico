  <style>
:root{--bg:#010308;--panel:rgba(5,10,20,.9);--stroke:rgba(0,242,254,.2);--text:#f1f5f9;--muted:#64748b;--accent:#00f2fe;--accent-glow:rgba(0,242,254,.3);--success:#10b981;--danger:#f43f5e;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:var(--mono);color:var(--text);background:var(--bg);background-image:radial-gradient(circle at 50% 0%,#0a192f 0%,#010308 75%);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}button,input{font-family:inherit}
header{padding:16px 28px;border-bottom:1px solid var(--stroke);background:var(--panel);display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(12px);flex-wrap:wrap;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.logo{font-size:13px;font-weight:bold;letter-spacing:3px;color:var(--accent);text-shadow:0 0 12px var(--accent-glow);display:flex;align-items:center;gap:8px}.logo:before{content:"";display:block;width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent)}
.header-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.api-config-bar{display:flex;align-items:center;gap:6px;font-size:11px;background:rgba(0,0,0,.4);border:1px solid var(--stroke);padding:4px 10px;border-radius:6px}.api-config-bar input{background:transparent;border:none;color:var(--text);font-size:11px;width:150px;outline:none}.api-config-bar button{background:rgba(0,242,254,.1);border:1px solid var(--accent);color:var(--accent);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:10px;font-weight:bold}.api-config-bar button:hover{background:var(--accent);color:#000}
.status-pill{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.02);padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.05)}.pulse{width:6px;height:6px;background:var(--success);border-radius:50%;box-shadow:0 0 8px var(--success);animation:blink 2s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.workspace{max-width:900px;width:95vw;margin:20px auto;flex:1;display:flex;flex-direction:column;gap:20px}.main-panel{background:var(--panel);border:1px solid var(--stroke);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.8);min-height:650px}.chat-scroll{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;max-height:68vh;scrollbar-width:thin;scrollbar-color:var(--accent) rgba(0,0,0,.5)}
.msg{padding:14px 16px;border-radius:8px;font-size:13px;line-height:1.6;max-width:92%;word-break:break-word}.msg.system{background:rgba(0,242,254,.03);border:1px solid rgba(0,242,254,.15);color:var(--accent);align-self:flex-start}.msg.user{background:rgba(79,172,254,.08);border:1px solid rgba(79,172,254,.25);color:#fff;align-self:flex-end}.msg.ai{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);color:#cbd5e1;align-self:flex-start;white-space:pre-line;display:flex;flex-direction:column;gap:10px;width:100%;max-width:100%}.msg.error{background:rgba(244,63,94,.05);border:1px solid rgba(244,63,94,.2);color:#fda4af;align-self:flex-start}
.doc-action-card{background:rgba(16,185,129,.03);border:1px solid rgba(16,185,129,.25);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;margin-top:6px}.doc-header-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.doc-action-title{color:var(--success);font-size:11px;font-weight:bold}.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.action-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:linear-gradient(135deg,var(--accent),#4facfe);color:#000;text-decoration:none;border-radius:4px;font-weight:bold;font-size:10px;cursor:pointer;border:none}.action-btn.download{background:linear-gradient(135deg,#10b981,#00b0ff)}.action-btn:hover{filter:brightness(1.1)}
.input-box-area{padding:16px;background:rgba(0,0,0,.4);border-top:1px solid var(--stroke);display:flex;gap:10px;align-items:center}.input-box-area input{flex:1;min-width:0;background:rgba(0,0,0,.6);border:1px solid var(--stroke);border-radius:6px;padding:12px 14px;color:var(--text);font-size:13px;outline:none}.input-box-area input:focus{border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow)}.btn-action{background:linear-gradient(135deg,var(--accent),#4facfe);color:#000;border:none;padding:12px 20px;border-radius:6px;font-weight:bold;font-size:12px;cursor:pointer}.btn-action:disabled{opacity:.4;cursor:not-allowed}
#pdfViewerModal{display:none;position:fixed;inset:0;width:100vw;height:100vh;background:rgba(1,3,8,.95);z-index:2000;backdrop-filter:blur(10px);flex-direction:column;padding:10px}.viewer-top{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--stroke);padding:10px 16px;border-radius:8px 8px 0 0;flex-wrap:wrap;gap:10px}.viewer-title-text{color:var(--accent);font-size:12px;font-weight:bold;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewer-nav-controls{display:flex;align-items:center;gap:8px}.page-nav-btn{background:rgba(0,242,254,.1);border:1px solid var(--accent);color:var(--accent);padding:4px 10px;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer}.page-nav-btn:hover{background:var(--accent);color:#000}.page-nav-btn:disabled{opacity:.3;cursor:not-allowed}.viewer-close{background:var(--danger);color:#fff;border:none;padding:6px 12px;border-radius:4px;font-weight:bold;cursor:pointer;font-size:11px}.viewer-body{flex:1;display:grid;grid-template-columns:1fr 350px;background:#040812;border:1px solid var(--stroke);border-top:none;border-radius:0 0 8px 8px;overflow:hidden;min-height:0}.canvas-container{overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:12px;background:#080d1a;width:100%;height:100%}#pdfCanvas{max-width:100%;height:auto;box-shadow:0 0 20px rgba(0,0,0,.9);background:white;display:block}.viewer-sidebar-chat{background:rgba(3,7,14,.98);border-left:1px solid var(--stroke);display:flex;flex-direction:column;padding:12px;gap:10px;min-height:0;height:100%}.v-chat-history{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;font-size:11px;padding-right:8px;scrollbar-width:thin;scrollbar-color:var(--accent) rgba(255,255,255,.1)}.v-msg{padding:10px 12px;border-radius:6px;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}.v-msg.bot{background:rgba(0,242,254,.05);border:1px solid rgba(0,242,254,.2);color:#cbd5e1}.v-msg.user{background:rgba(79,172,254,.1);border:1px solid rgba(79,172,254,.3);color:#fff;align-self:flex-end}.v-input-row{display:flex;gap:6px;margin-top:auto}.v-input-row input{flex:1;min-width:0;background:rgba(0,0,0,.6);border:1px solid var(--stroke);border-radius:4px;padding:8px;color:var(--text);font-size:11px;outline:none}.v-send{background:var(--accent);color:#000;border:none;padding:8px 12px;border-radius:4px;font-weight:bold;cursor:pointer;font-size:11px}.v-send:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:900px){.viewer-body{display:flex;flex-direction:column}.canvas-container{flex:1;min-height:45%}.viewer-sidebar-chat{border-left:none;border-top:1px solid var(--stroke);height:45%}}@media(max-width:600px){header{padding:12px}.logo{font-size:10px;letter-spacing:2px}.header-controls{width:100%;gap:8px}.api-config-bar{flex:1}.api-config-bar input{width:100%}.workspace{width:98vw;margin:8px auto}.main-panel{min-height:75vh}.input-box-area{padding:10px}.btn-action{padding:12px 14px}#pdfViewerModal{padding:4px}.viewer-title-text{max-width:100%;width:100%}}
</style>
 </head>
 <body>
  <header>
   <div class="logo">NEXUS-X // QUANTUM CORE</div>
   <div class="header-controls">
    <div class="api-config-bar">
     <span>API Key:</span><input id="apiKeyInput" type="password" placeholder="Pegá tu clave..." autocomplete="off">
     <button id="saveApiKeyBtn">GUARDAR</button>
    </div>
    <div class="status-pill">
     <div class="pulse"></div>
     <span id="sysState">Inicializando...</span>
    </div>
   </div>
  </header>
  <div class="workspace">
   <div class="main-panel">
    <div class="chat-scroll" id="mainChatBox">
     <div class="msg system">&gt;&gt; Núcleo listo. Ingresá un concepto para buscar en los manuales.</div>
    </div>
    <div class="input-box-area">
     <input id="mainQueryInput" type="text" placeholder="Buscá un concepto en los manuales..." autocomplete="off" disabled>
     <button class="btn-action" id="mainSendBtn" disabled>BUSCAR</button>
    </div>
   </div>
  </div>
  <div id="pdfViewerModal">
   <div class="viewer-top">
    <span class="viewer-title-text" id="modalDocTitle">📄 Lector Activo</span>
    <div class="viewer-nav-controls">
     <button class="page-nav-btn" id="prevPageBtn">◀ ANTERIOR</button>
     <span id="pageIndicator" style="font-size:11px;color:var(--accent)">Pág. 1 / 1</span>
     <button class="page-nav-btn" id="nextPageBtn">SIGUIENTE ▶</button>
    </div>
    <button class="viewer-close" id="closeModalBtn">CERRAR [X]</button>
   </div>
   <div class="viewer-body">
    <div class="canvas-container">
     <canvas id="pdfCanvas"></canvas>
    </div>
    <div class="viewer-sidebar-chat">
     <div style="font-size:11px;color:var(--success);font-weight:bold;border-bottom:1px solid var(--stroke);padding-bottom:6px">🤖 ASISTENTE DE GEMINI</div>
     <div class="v-chat-history" id="modalChatHistory">
      <div class="v-msg bot">Documento cargado. Consultame sobre cualquier parte del manual.</div>
     </div>
     <div class="v-input-row">
      <input id="modalQueryInput" type="text" placeholder="Preguntale a Gemini..." autocomplete="off">
      <button class="v-send" id="modalSendBtn">PREGUNTAR</button>
     </div>
    </div>
   </div>
  </div>
  <script>
(()=>{
'use strict';

const GITHUB_CONFIG={owner:'miqueas80',repo:'laboratorio-escolar-tecnico',branch:'main'};
const MODEL_PREFERENCE=['gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite','gemini-3.1-flash-lite'];
const API_BASE='https://generativelanguage.googleapis.com/v1beta';
let globalApiKey=localStorage.getItem('nexus_gemini_key')||'';
let activeModel='';
let repositoryFiles=[];
const repositoryTexts={};
let activePdfDoc=null,activePageNum=1,activeFileName='',activePagesCache=[];
let renderRequestId=0,searchBusy=false,aiBusy=false;
const $=s=>document.querySelector(s);
const apiKeyInput=$('#apiKeyInput'),mainQueryInput=$('#mainQueryInput'),mainSendBtn=$('#mainSendBtn'),modalQueryInput=$('#modalQueryInput'),modalSendBtn=$('#modalSendBtn'),modal=$('#pdfViewerModal');
apiKeyInput.value=globalApiKey?'••••••••••':'';
apiKeyInput.addEventListener('focus',()=>{if(apiKeyInput.value==='••••••••••')apiKeyInput.value='';});
$('#saveApiKeyBtn').addEventListener('click',()=>{const val=apiKeyInput.value.trim();if(!val||val==='••••••••••'){alert(globalApiKey?'Ya existe una API Key guardada.':'Pegá una API Key válida.');return;}localStorage.setItem('nexus_gemini_key',val);globalApiKey=val;apiKeyInput.value='••••••••••';activeModel='';$('#sysState').textContent='Verificando API...';initGemini().catch(()=>{});});
function addMsg(sel,text,type){const box=$(sel),div=document.createElement('div');div.className=`msg ${type}`;div.textContent=text;box.appendChild(div);box.scrollTop=box.scrollHeight;return div;}
function normalizeStr(str){return String(str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();}
function escapeHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function formatAIText(text){return escapeHtml(text).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}
function getQueryTokens(q){return [...new Set(normalizeStr(q).split(/\s+/).filter(w=>w.length>=3))];}
function scorePage(pageText,query){const p=normalizeStr(pageText),q=normalizeStr(query),words=getQueryTokens(query);if(!p||!words.length)return 0;let score=p.includes(q)?100:0;for(const w of words){if(p.includes(w))score+=10;const n=p.split(w).length-1;if(n>1)score+=Math.min(n*2,10);}return score;}
async function fetchGitHubPath(path=''){const suffix=path?`/${path.split('/').map(encodeURIComponent).join('/')}`:'';const url=`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents${suffix}`;const res=await fetch(url,{headers:{Accept:'application/vnd.github+json'}});if(!res.ok){let msg=`GitHub HTTP ${res.status}`;try{const d=await res.json();if(d.message)msg+=`: ${d.message}`;}catch{}throw new Error(msg);}return res.json();}
async function discoverPDFs(path='',out=[]){const data=await fetchGitHubPath(path);if(!Array.isArray(data))return out;for(const item of data){if(item.type==='file'&&item.name.toLowerCase().endsWith('.pdf'))out.push({name:item.name,path:item.path,download_url:item.download_url});else if(item.type==='dir'&&item.path.split('/').length<=5){try{await discoverPDFs(item.path,out);}catch(e){console.warn('No se pudo explorar',item.path,e);}}}return out;}
async function indexAllPdfs(){let ok=0;$('#sysState').textContent=`Indexando 0/${repositoryFiles.length}...`;for(let i=0;i<repositoryFiles.length;i++){const file=repositoryFiles[i];$('#sysState').textContent=`Indexando ${i+1}/${repositoryFiles.length}...`;try{const pdf=await pdfjsLib.getDocument({url:file.download_url,disableAutoFetch:false,disableStream:false}).promise;const original=[],normalized=[];for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const content=await page.getTextContent();const text=content.items.map(x=>x.str||'').join(' ').replace(/\s+/g,' ').trim();original.push(text);normalized.push(normalizeStr(text));}repositoryTexts[file.path]={original,normalized,numPages:pdf.numPages};ok++;}catch(e){console.warn('No se pudo indexar',file.path,e);repositoryTexts[file.path]={original:[],normalized:[],numPages:0,error:true};}}$('#sysState').textContent='Sistema sincronizado';mainQueryInput.disabled=false;mainSendBtn.disabled=false;addMsg('#mainChatBox',`>> Sistema listo.\n>> ${ok}/${repositoryFiles.length} manuales indexados.\n>> Podés buscar conceptos, fórmulas o palabras clave.`,'system');}
async function fetchFiles(){try{$('#sysState').textContent='Conectando con GitHub...';repositoryFiles=await discoverPDFs();if(!repositoryFiles.length){$('#sysState').textContent='Sin manuales';addMsg('#mainChatBox','>> No se encontraron archivos PDF en el repositorio.','error');return;}await indexAllPdfs();}catch(e){console.error(e);$('#sysState').textContent='Error de conexión';addMsg('#mainChatBox',`>> No se pudo sincronizar GitHub.\n${e.message}`,'error');}}

/* Detecta automáticamente un modelo que la API Key realmente pueda usar. */
async function listAvailableModels(key){const res=await fetch(`${API_BASE}/models?pageSize=1000`,{headers:{'x-goog-api-key':key}});let data={};try{data=await res.json();}catch{}if(!res.ok)throw new Error(data.error?.message||`No se pudo consultar la lista de modelos (HTTP ${res.status}).`);return Array.isArray(data.models)?data.models:[];}
async function initGemini(){const key=localStorage.getItem('nexus_gemini_key')||globalApiKey;if(!key){activeModel='';return false;}try{const models=await listAvailableModels(key);const usable=new Map();for(const m of models){const name=String(m.name||'').replace(/^models\//,'');const methods=m.supportedGenerationMethods||[];if(methods.includes('generateContent'))usable.set(name,m);}activeModel=MODEL_PREFERENCE.find(n=>usable.has(n))||[...usable.keys()].find(n=>/^gemini-.*flash/i.test(n))||'';if(!activeModel)throw new Error('La API Key funciona, pero no encontré un modelo Gemini compatible con generateContent.');$('#sysState').textContent=`IA: ${activeModel}`;return true;}catch(e){console.error(e);$('#sysState').textContent='API no disponible';addMsg('#mainChatBox',`>> API Gemini: ${e.message}`,'error');return false;}}
async function callGeminiAPI(prompt,key){if(!key)throw new Error('No hay API Key configurada.');if(!activeModel){await initGemini();}if(!activeModel)throw new Error('No hay un modelo Gemini disponible para esta API Key.');const url=`${API_BASE}/models/${encodeURIComponent(activeModel)}:generateContent`;const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}]})});let data={};try{data=await res.json();}catch{}if(!res.ok){if(res.status===400)throw new Error(data.error?.message||'Solicitud inválida.');if(res.status===401||res.status===403)throw new Error('La API Key no es válida o no tiene permisos.');if(res.status===404){activeModel='';throw new Error('El modelo dejó de estar disponible. Guardá nuevamente la API Key o reintentá para seleccionar otro modelo.');}if(res.status===429)throw new Error('Se alcanzó el límite de solicitudes. Esperá unos segundos.');throw new Error(data.error?.message||`Error HTTP ${res.status}`);}const text=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim();if(!text)throw new Error('Gemini no devolvió texto.');return text;}
function searchRepository(query){const results=[];for(const file of repositoryFiles){const data=repositoryTexts[file.path];if(!data)continue;for(let i=0;i<data.normalized.length;i++){const score=scorePage(data.original[i],query);if(score>0)results.push({file,page:i+1,score,text:data.original[i]});}}results.sort((a,b)=>b.score-a.score);return results;}
async function loadPdfInModal(file,targetPage=1){activeFileName=file.path;activePagesCache=repositoryTexts[file.path]?.original||[];$('#modalDocTitle').textContent=`📄 ${file.path}`;modal.style.display='flex';$('#modalChatHistory').innerHTML='';addViewerMessage(`Manual "${file.name}" cargado.\nPáginas: ${activePagesCache.length}\n\nConsultame sobre cualquier parte del manual.`,'bot');try{activePdfDoc=await pdfjsLib.getDocument({url:file.download_url}).promise;activePageNum=Math.min(Math.max(1,targetPage),activePdfDoc.numPages);await renderCurrentPage();}catch(e){addViewerMessage(`⚠️ No se pudo cargar el PDF.\n${e.message}`,'bot');}}
async function renderCurrentPage(){if(!activePdfDoc)return;const id=++renderRequestId;try{$('#pageIndicator').textContent=`Pág. ${activePageNum} / ${activePdfDoc.numPages}`;$('#prevPageBtn').disabled=activePageNum<=1;$('#nextPageBtn').disabled=activePageNum>=activePdfDoc.numPages;const page=await activePdfDoc.getPage(activePageNum);if(id!==renderRequestId)return;const canvas=$('#pdfCanvas'),ctx=canvas.getContext('2d'),container=document.querySelector('.canvas-container'),base=page.getViewport({scale:1}),width=Math.max(250,(container.clientWidth||700)-24),scale=Math.max(.5,Math.min(2.5,width/base.width)),vp=page.getViewport({scale});canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await page.render({canvasContext:ctx,viewport:vp}).promise;}catch(e){console.error(e);}}
function addViewerMessage(text,type){const h=$('#modalChatHistory'),d=document.createElement('div');d.className=`v-msg ${type}`;d.textContent=text;h.appendChild(d);h.scrollTop=h.scrollHeight;return d;}
async function handleModalAIQuery(){if(aiBusy)return;const value=modalQueryInput.value.trim();if(!value)return;const key=localStorage.getItem('nexus_gemini_key')||globalApiKey;addViewerMessage(value,'user');modalQueryInput.value='';const bot=addViewerMessage('Analizando el manual...','bot');if(!key){bot.textContent='⚠️ Primero guardá tu API Key.';return;}aiBusy=true;modalSendBtn.disabled=true;try{const ranked=[];for(let i=0;i<activePagesCache.length;i++){const score=scorePage(activePagesCache[i],value);if(score>0)ranked.push({page:i+1,score,text:activePagesCache[i]});}ranked.sort((a,b)=>b.score-a.score);const selected=ranked.slice(0,8);let context=selected.length?selected.map(x=>`--- PÁGINA ${x.page} ---\n${x.text.slice(0,7000)}`).join('\n\n'):activePagesCache.slice(0,3).map((x,i)=>`--- PÁGINA ${i+1} ---\n${x.slice(0,5000)}`).join('\n\n');const prompt=`Sos el asistente académico de NEXUS-X. Respondé en español claro, natural y directo.\n\nMANUAL: ${activeFileName}\n\nCONSULTA: ${value}\n\nCONTEXTO RELEVANTE:\n${context}\n\nREGLAS:\n- Basate principalmente en el contenido proporcionado.\n- No inventes información que contradiga el manual.\n- Indicá las páginas cuando puedas.\n- Si la información no aparece claramente, decilo.\n- Explicá como un buen tutor.\n- No uses LaTeX ni símbolos $.\n- Para fórmulas químicas escribí H2O, CO2, SO2, etc.`;const response=await callGeminiAPI(prompt,key);bot.innerHTML=formatAIText(response);}catch(e){bot.textContent=`⚠️ Error al consultar Gemini:\n${e.message}`;}finally{aiBusy=false;modalSendBtn.disabled=false;}}
async function handleMainGlobalQuery(){if(searchBusy)return;const value=mainQueryInput.value.trim();if(!value)return;searchBusy=true;mainSendBtn.disabled=true;addMsg('#mainChatBox',value,'user');mainQueryInput.value='';addMsg('#mainChatBox',`>> Buscando: "${value}"...`,'system');try{const results=searchRepository(value),grouped=new Map();for(const r of results){if(!grouped.has(r.file.path))grouped.set(r.file.path,{file:r.file,pages:[],score:0});const g=grouped.get(r.file.path);g.pages.push(r.page);g.score+=r.score;}const docs=[...grouped.values()].sort((a,b)=>b.score-a.score);if(!docs.length){addMsg('#mainChatBox',`>> No encontré coincidencias para "${value}".\n>> Probá con otra palabra o concepto.`,'error');return;}const aiMsg=addMsg('#mainChatBox',`Se encontraron ${docs.length} manuales relacionados:`,'ai');for(const d of docs.slice(0,10)){const f=d.file,pages=[...new Set(d.pages)].sort((a,b)=>a-b).slice(0,8),card=document.createElement('div');card.className='doc-action-card';card.innerHTML=`<div class="doc-header-row"><span class="doc-action-title">📄 ${escapeHtml(f.name)}</span></div><div style="font-size:10px;color:var(--muted)">Páginas relevantes: ${pages.join(', ')}</div><div class="actions-row"><button class="action-btn open-file-btn" type="button">🔍 ABRIR EN VISOR</button><a class="action-btn download" href="${escapeHtml(f.download_url)}" target="_blank" rel="noopener noreferrer">💾 DESCARGAR PDF</a></div>`;aiMsg.appendChild(card);card.querySelector('.open-file-btn').addEventListener('click',()=>loadPdfInModal(f,pages[0]||1));}}catch(e){addMsg('#mainChatBox',`>> Error durante la búsqueda:\n${e.message}`,'error');}finally{searchBusy=false;mainSendBtn.disabled=false;}}
$('#prevPageBtn').addEventListener('click',async()=>{if(activePdfDoc&&activePageNum>1){activePageNum--;await renderCurrentPage();}});$('#nextPageBtn').addEventListener('click',async()=>{if(activePdfDoc&&activePageNum<activePdfDoc.numPages){activePageNum++;await renderCurrentPage();}});$('#closeModalBtn').addEventListener('click',()=>{modal.style.display='none';renderRequestId++;activePdfDoc=null;});mainSendBtn.addEventListener('click',handleMainGlobalQuery);mainQueryInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handleMainGlobalQuery();}});modalSendBtn.addEventListener('click',handleModalAIQuery);modalQueryInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handleModalAIQuery();}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.style.display==='flex'){$('#closeModalBtn').click();}});let resizeTimer;window.addEventListener('resize',()=>{if(modal.style.display!=='flex')return;clearTimeout(resizeTimer);resizeTimer=setTimeout(renderCurrentPage,150);});
(async()=>{if(!window.pdfjsLib){$('#sysState').textContent='PDF.js no disponible';addMsg('#mainChatBox','>> No se pudo cargar PDF.js. Revisá tu conexión.','error');return;}if(globalApiKey)await initGemini();await fetchFiles();})();
})();
</script>
