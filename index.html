<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NEXUS-X // QUANTUM CORE v5.5</title>
    <!-- ... (tu CSS se mantiene igual, no es necesario cambiarlo) ... -->
    <style>
        /* ... (Mantén tu CSS igual) ... */
    </style>
</head>
<body>
    <!-- ... (Mantén tu estructura HTML igual) ... -->

    <script>
        (() => {
            'use strict';

            const GITHUB_CONFIG = { owner: "miqueas80", repo: "laboratorio-escolar-tecnico", branch: "main" };
            
            let globalApiKey = localStorage.getItem('nexus_gemini_key') || "";
            const apiKeyInput = document.getElementById('apiKeyInput');
            if (apiKeyInput) apiKeyInput.value = globalApiKey;

            document.getElementById('saveApiKeyBtn').addEventListener('click', () => {
                const val = apiKeyInput.value.trim();
                if(val) {
                    localStorage.setItem('nexus_gemini_key', val);
                    globalApiKey = val;
                    alert("¡API Key guardada!");
                }
            });

            // ... (Resto de variables) ...

            // --- MEJORA: Indexado paralelo y más robusto ---
            async function indexAllPdfs() {
                $('#sysState').textContent = "Indexando...";
                
                const tasks = repositoryFiles.map(async (file) => {
                    try {
                        const url = `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${encodeURIComponent(file)}`;
                        const pdf = await pdfjsLib.getDocument(url).promise;
                        
                        let pagesOriginal = [];
                        let pagesNormalized = [];
                        
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const txt = await page.getTextContent();
                            const textStr = txt.items.map(it => it.str).join(" ");
                            pagesOriginal.push(textStr);
                            pagesNormalized.push(normalizeStr(textStr));
                        }
                        repositoryTexts[file] = { original: pagesOriginal, normalized: pagesNormalized };
                    } catch(err) {
                        console.error(`Error procesando ${file}:`, err);
                        repositoryTexts[file] = { original: [], normalized: [] };
                    }
                });

                await Promise.allSettled(tasks);
                
                $('#sysState').textContent = "Sistema sincronizado";
                $('#mainQueryInput').disabled = false;
                $('#mainSendBtn').disabled = false;
                addMsg('#mainChatBox', `>> ${repositoryFiles.length} manuales listos.`, 'system');
            }

            // --- MEJORA: Manejo de API más limpio ---
            async function callGeminiAPI(prompt, key) {
                // Asegúrate de usar modelos que existan en tu plan de Google AI Studio
                const models = ["gemini-1.5-flash", "gemini-1.5-pro"]; 

                for (const model of models) {
                    try {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
                        const res = await fetch(url, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                        });

                        if (!res.ok) continue;

                        const data = await res.json();
                        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) return text;
                    } catch (e) {
                        console.warn(`Fallo con ${model}, intentando siguiente...`);
                    }
                }
                throw new Error("No se pudo obtener respuesta de Gemini.");
            }

            // ... (Resto de tus funciones como renderCurrentPage, handleMainGlobalQuery, etc.) ...
            // Asegúrate de agregar validación en handleModalAIQuery:
            async function handleModalAIQuery() {
                const val = $('#modalQueryInput').value.trim();
                if(!val) return;
                
                // Deshabilitar botón para evitar envíos múltiples
                $('#modalSendBtn').disabled = true;
                
                // ... (tu lógica de chat) ...
                
                try {
                    // ... tu llamada a API ...
                } finally {
                    $('#modalSendBtn').disabled = false; // Re-habilitar
                }
            }
            
            // ... (Inicialización) ...
            fetchFiles();
        })();
    </script>
</body>
</html>
