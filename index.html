<!doctype html>
<html lang="es">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS-X // Cloud Core + Descarga Local</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <style>
    :root{
      --bg:#02040a; --panel:rgba(8, 15, 28, 0.85); --stroke:rgba(0, 242, 254, 0.25);
      --text:#e2e8f0; --muted:#64748b; --accent:#00f2fe; --accent2:#4facfe;
      --success:#39ff88; --mono:ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; font-family:var(--mono); color:var(--text); background:var(--bg);
      background-image: linear-gradient(rgba(0,242,254,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,242,254,0.03) 1px, transparent 1px);
      background-size: 30px 30px; min-height:100vh; display:flex; flex-direction:column;
    }
    header{
      padding:16px 24px; border-bottom:1px solid var(--stroke); background:var(--panel);
      display:flex; justify-content:space-between; align-items:center; backdrop-filter:blur(10px);
    }
    .logo{font-size:14px; font-weight:bold; letter-spacing:2px; color:var(--accent); text-shadow:0 0 10px rgba(0,242,254,0.4);}
    .status{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:8px;}
    .pulse{width:6px; height:6px; background:var(--accent); border-radius:50%; box-shadow:0 0 8px var(--accent); animation:blink 1.5s infinite;}
    @keyframes blink{0%{opacity:1;} 50%{opacity:0.2;} 100%{opacity:1;}}

    .container{max-width:1000px; width:94vw; margin:24px auto; flex:1; display:flex; flex-direction:column; gap:16px;}
    
    .chat-box{
      flex:1; background:var(--panel); border:1px solid var(--stroke); border-radius:12px;
      padding:20px; overflow-y:auto; max-height:65vh; min-height:420px; display:flex; flex-direction:column; gap:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.8);
    }
    .msg{padding:14px 18px; border-radius:8px; font-size:13px; line-height:1.6; max-width:88%; white-space: pre-line;}
    .msg.system{background:rgba(0,242,254,0.04); border:1px solid rgba(0,242,254,0.2); color:var(--accent); align-self:flex-start;}
    .msg.user{background:rgba(79,172,254,0.1); border:1px solid rgba(79,172,254,0.3); color:#fff; align-self:flex-end;}
    .msg.ai{background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); color:#cbd5e1; align-self:flex-start;}
    .msg.error{background:rgba(255,85,119,0.05); border:1px solid rgba(255,85,119,0.3); color:#ff9bad; align-self:flex-start;}

    .doc-action-card{
      margin-top:12px; padding:12px; background:rgba(57,255,136,0.03); border:1px solid rgba(57,255,136,0.25);
      border-radius:6px; display:flex; flex-direction:column; gap:10px;
    }
    .doc-action-title{color:var(--success); font-size:11px; font-weight:bold;}
    .actions-row{display:flex; gap:10px; flex-wrap:wrap;}
    .action-btn{
      display:inline-flex; align-items:center; gap:6px; padding:8px 14px; background:linear-gradient(135deg, var(--accent), var(--accent2));
      color:#000; text-decoration:none; border-radius:6px; font-weight:bold; font-size:11px; cursor:pointer;
      box-shadow:0 0 10px rgba(0,242,254,0.3); transition:transform 0.1s; border:none;
    }
    .action-btn.download{background:linear-gradient(135deg, #39ff88, #00b0ff); color:#000;}
    .action-btn:hover{transform:translateY(-1px); box-shadow:0 0 15px rgba(0,242,254,0.6);}

    #pdfViewerModal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 4, 10, 0.9); z-index: 1000; backdrop-filter: blur(8px);
      flex-direction: column; padding: 20px;
    }
    .viewer-header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--panel); border: 1px solid var(--stroke); padding: 10px 20px;
      border-radius: 8px 8px 0 0; font-size: 13px; color: var(--accent);
    }
    .close-viewer {
      background: #ff5577; color: #fff; border: none; padding: 6px 12px;
      border-radius: 4px; cursor: pointer; font-family: var(--mono); font-weight: bold; font-size: 11px;
    }
    .viewer-body {
      flex: 1; background: #0b1329; border: 1px solid var(--stroke); border-top: none;
      border-radius: 0 0 8px 8px; overflow: auto; display: flex; justify-content: center; padding: 20px;
    }
    canvas { max-width: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.8); background: white; }

    .input-panel{
      background:var(--panel); border:1px solid var(--stroke); border-radius:12px; padding:12px;
      display:flex; gap:12px; align-items:center;
    }
    .input-panel input{
      flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:var(--mono); font-size:14px;
    }
    .btn{
      background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#000; border:none;
      padding:10px 20px; border-radius:6px; font-weight:bold; font-family:var(--mono); font-size:12px; cursor:pointer;
      transition:transform 0.1s, box-shadow 0.2s;
    }
    .btn:disabled{opacity:0.5; cursor:not-allowed;}
    .btn:hover:not(:disabled){box-shadow:0 0 15px rgba(0,242,254,0.5); transform:translateY(-1px);}
  </style>
 </head>
 <body>
  <header>
   <div class="logo">NEXUS-X // CLOUD STREAM & DOWNLOAD</div>
   <div class="status"><div class="pulse"></div><span id="sysState">Conectado a la nube</span></div>
  </header>

  <div class="container">
   <div class="chat-box" id="chatBox">
    <div class="msg system">>> Sistema en línea. Escribí tu consulta para buscar en los manuales de la nube.</div>
   </div>

   <div class="input-panel">
    <input id="queryInput" type="text" placeholder="Escribe palabras clave (ej: soldadura, motor, circuito)..." autocomplete="off">
    <button class="btn" id="sendBtn">CONSULTAR</button>
   </div>
  </div>

  <div id="pdfViewerModal">
    <div class="viewer-header">
      <span id="viewerTitle">📄 Lector Interno - Documento</span>
      <button class="close-viewer" id="closeViewerBtn">CERRAR [X]</button>
    </div>
    <div class="viewer-body" id="viewerCanvasContainer">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      // CONFIGURACIÓN DE TU REPOSITORIO DE GITHUB
      const GITHUB_CONFIG = {
        owner: "miqueas80",
        repo: "laboratorio-escolar-tecnico",
        branch: "main"
      };

      // ACÁ AGREGÁS LOS NOMBRES DE TUS PDFs MANUALMENTE O SE LEE DE LA RED
      // (Simple, rápido y sin errores de CORS molestos)
      let repositoryFiles = [
        "manual-soldadura.pdf",
        "neumatica-basica.pdf",
        "circuitos-electricos.pdf"
      ];

      const $ = (s) => document.querySelector(s);

      function appendMessage(text, sender) {
        const box = $('#chatBox');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
      }

      function processQuery(query) {
        const qLower = query.toLowerCase();
        const searchWords = qLower.split(/\s+/).filter(w => w.length > 2);
        
        if (searchWords.length === 0) return { text: ">> Escribe palabras clave más largas para buscar.", fileName: null };

        // Búsqueda directa basada en coincidencia de nombres de archivos y palabras clave
        let matchedFile = repositoryFiles.find(file => {
          const nameClean = file.replace(/[-_]/g, " ").toLowerCase();
          return searchWords.some(word => nameClean.includes(word));
        });

        // Si no coincide con el nombre exacto, toma el primero por defecto como referencia rápida
        if (!matchedFile) {
          matchedFile = repositoryFiles[0];
        }

        const fileUrl = `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${matchedFile}`;

        return {
          text: `>> ARCHIVO LOCALIZADO EN LA NUBE\n\nDocumento sugerido para tu consulta sobre: "${query}"`,
          fileName: matchedFile,
          fileUrl: fileUrl
        };
      }

      function handleQuerySubmission() {
        const val = $('#queryInput').value.trim();
        if (!val) return;
        
        appendMessage(val, 'user');
        $('#queryInput').value = '';

        setTimeout(() => {
          const result = processQuery(val);
          const aiMsg = appendMessage(result.text, 'ai');

          if (result.fileName) {
            const card = document.createElement('div');
            card.className = 'doc-action-card';
            card.innerHTML = `
              <div class="doc-action-title">📄 ${result.fileName}</div>
              <div class="actions-row">
                <button class="action-btn open-online-btn"><span>🌐</span> ABRIR ONLINE</button>
                <a href="${result.fileUrl}" download="${result.fileName}" class="action-btn download"><span>💾</span> DESCARGAR AL TARRITO (PDF)</a>
              </div>
            `;
            aiMsg.appendChild(card);
            
            // Botón para abrir el visor online
            card.querySelector('.open-online-btn').addEventListener('click', () => {
              openCloudPDFViewer(result.fileUrl, result.fileName);
            });
          }

          const box = $('#chatBox');
          box.scrollTop = box.scrollHeight;
          $('#queryInput').focus();
        }, 100);
      }

      async function openCloudPDFViewer(url, fileName) {
        $('#viewerTitle').textContent = `📄 Lector Online - ${fileName}`;
        $('#pdfViewerModal').style.display = 'flex';

        try {
          const loadingTask = pdfjsLib.getDocument(url);
          const pdfDoc = await loadingTask.promise;
          const page = await pdfDoc.getPage(1);

          const canvas = document.getElementById('pdfCanvas');
          const context = canvas.getContext('2d');
          const viewport = page.getViewport({ scale: 1.3 });

          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;
        } catch (e) {
          console.error("Error al cargar el PDF desde la nube:", e);
          alert("No se pudo cargar el PDF. Verificá tu conexión a internet.");
        }
      }

      $('#closeViewerBtn').addEventListener('click', () => {
        $('#pdfViewerModal').style.display = 'none';
      });

      $('#sendBtn').addEventListener('click', handleQuerySubmission);
      $('#queryInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleQuerySubmission();
      });
    })();
  </script>
 </body>
</html>
