<!doctype html>
<html lang="es">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS-X // Autonomous RAG Core</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <style>
    :root{
      --bg:#02040a; --panel:rgba(8, 15, 28, 0.85); --stroke:rgba(0, 242, 254, 0.25);
      --text:#e2e8f0; --muted:#64748b; --accent:#00f2fe; --accent2:#4facfe;
      --success:#39ff88; --mono:ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; font-family:var(--mono); color:var(--text); background:var(--bg);
      background-image: linear-gradient(rgba(0,242,254,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,242,254,0.03) 1px, transparent 1px);
      background-size: 30px 30px; min-height:100vh; display:flex; flex-direction:column;
    }
    header{
      padding:16px 24px; border-bottom:1px solid var(--stroke); background:var(--panel);
      display:flex; justify-content:space-between; align-items:center; backdrop-filter:blur(10px);
    }
    .logo{font-size:14px; font-weight:bold; letter-spacing:2px; color:var(--accent); text-shadow:0 0 10px rgba(0,242,254,0.4);}
    .status{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:8px;}
    .pulse{width:6px; height:6px; background:var(--accent); border-radius:50%; box-shadow:0 0 8px var(--accent); animation:blink 1.5s infinite;}
    @keyframes blink{0%{opacity:1;} 50%{opacity:0.2;} 100%{opacity:1;}}

    .container{max-width:1000px; width:94vw; margin:24px auto; flex:1; display:flex; flex-direction:column; gap:16px;}
    
    .chat-box{
      flex:1; background:var(--panel); border:1px solid var(--stroke); border-radius:12px;
      padding:20px; overflow-y:auto; max-height:65vh; min-height:420px; display:flex; flex-direction:column; gap:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.8);
    }
    .msg{padding:14px 18px; border-radius:8px; font-size:13px; line-height:1.6; max-width:88%; white-space: pre-line;}
    .msg.system{background:rgba(0,242,254,0.04); border:1px solid rgba(0,242,254,0.2); color:var(--accent); align-self:flex-start;}
    .msg.user{background:rgba(79,172,254,0.1); border:1px solid rgba(79,172,254,0.3); color:#fff; align-self:flex-end;}
    .msg.ai{background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); color:#cbd5e1; align-self:flex-start;}
    .msg.error{background:rgba(255,85,119,0.05); border:1px solid rgba(255,85,119,0.3); color:#ff9bad; align-self:flex-start;}

    .doc-action-card{
      margin-top:12px; padding:12px; background:rgba(57,255,136,0.03); border:1px solid rgba(57,255,136,0.25);
      border-radius:6px; display:flex; flex-direction:column; gap:8px;
    }
    .doc-action-title{color:var(--success); font-size:11px; font-weight:bold;}
    .open-btn{
      display:inline-flex; align-items:center; gap:8px; padding:8px 14px; background:linear-gradient(135deg, var(--accent), var(--accent2));
      color:#000; text-decoration:none; border-radius:6px; font-weight:bold; font-size:11px; width:fit-content;
      box-shadow:0 0 10px rgba(0,242,254,0.3); transition:transform 0.1s;
    }
    .open-btn:hover{transform:translateY(-1px); box-shadow:0 0 15px rgba(0,242,254,0.6);}

    .input-panel{
      background:var(--panel); border:1px solid var(--stroke); border-radius:12px; padding:12px;
      display:flex; gap:12px; align-items:center;
    }
    .input-panel input{
      flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:var(--mono); font-size:14px;
    }
    .btn{
      background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#000; border:none;
      padding:10px 20px; border-radius:6px; font-weight:bold; font-family:var(--mono); font-size:12px; cursor:pointer;
      transition:transform 0.1s, box-shadow 0.2s;
    }
    .btn:disabled{opacity:0.5; cursor:not-allowed;}
    .btn:hover:not(:disabled){box-shadow:0 0 15px rgba(0,242,254,0.5); transform:translateY(-1px);}
  </style>
 </head>
 <body>
  <header>
   <div class="logo">NEXUS-X // LOCAL RAG KERNEL</div>
   <div class="status"><div class="pulse"></div><span id="sysState">Escaneando repositorio...</span></div>
  </header>

  <div class="container">
   <div class="chat-box" id="chatBox">
    <div class="msg system">>> NEXUS-X Core inicializado. Sincronizando documentos del repositorio técnico... Escribe tu consulta abajo.</div>
   </div>

   <div class="input-panel">
    <input id="queryInput" type="text" placeholder="Ej: ¿Qué dice sobre los óxidos, nomenclatura o normas de seguridad?" autocomplete="off" disabled>
    <button class="btn" id="sendBtn" disabled>CONSULTAR</button>
   </div>
  </div>

  <script>
    (() => {
      'use strict';

      const GITHUB_CONFIG = {
        owner: "miqueas80",
        repo: "laboratorio-escolar-tecnico",
        branch: "main"
      };

      let repository = [];
      const $ = (s) => document.querySelector(s);

      async function extractPDF(url) {
        try {
          const task = pdfjsLib.getDocument(url);
          const doc = await task.promise;
          let text = "";
          for (let i = 1; i <= doc.numPages; i++) {
            const page = await doc.getPage(i);
            const content = await page.getTextContent();
            text += " " + content.items.map(item => item.str).join(" ");
          }
          return text;
        } catch(e) {
          console.warn("Error leyendo PDF:", url);
          return "";
        }
      }

      async function discoverAndIndexFiles() {
        const treeUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/git/trees/${GITHUB_CONFIG.branch}?recursive=1`;

        try {
          const res = await fetch(treeUrl);
          if (!res.ok) throw new Error("No se pudo conectar con la API de GitHub.");
          const data = await res.json();
          
          const pdfFiles = (data.tree || []).filter(item => item.type === "blob" && item.path.toLowerCase().endsWith('.pdf'));

          if (pdfFiles.length === 0) {
            $('#sysState').textContent = "No se encontraron PDFs";
            appendMessage(">> ADVERTENCIA: No se detectaron archivos .pdf en el repositorio.", "error");
            return;
          }

          $('#sysState').textContent = `Procesando ${pdfFiles.length} documentos...`;

          for (const file of pdfFiles) {
            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${file.path}`;
            const githubViewUrl = `https://github.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/blob/${GITHUB_CONFIG.branch}/${file.path}`;
            const fileName = file.path.split('/').pop();

            $('#sysState').textContent = `Leyendo: ${fileName}`;
            const textContent = await extractPDF(rawUrl);

            repository.push({
              id: file.path,
              name: fileName,
              fileRef: githubViewUrl,
              content: textContent
            });
          }

          $('#sysState').textContent = "Núcleo neural operativo al 100%";
          $('#queryInput').disabled = false;
          $('#sendBtn').disabled = false;
          
          appendMessage(`>> Indexación autónoma completada con éxito.\n>> Se procesaron ${repository.length} documentos del repositorio técnico.\n>> Pregúntame lo que necesites encontrar.`, "system");

        } catch (err) {
          $('#sysState').textContent = "Error de indexación";
          appendMessage(`>> Error al conectar con GitHub: ${err.message}. Comprueba tu red.`, "error");
        }
      }

      function appendMessage(text, sender) {
        const box = $('#chatBox');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
      }

      function processQuery(query) {
        if (repository.length === 0) {
          return { text: ">> No hay documentos indexados en este momento.", doc: null };
        }

        const qLower = query.toLowerCase();
        let bestMatch = null;
        let highestScore = 0;

        repository.forEach(doc => {
          const words = qLower.split(/\s+/);
          let score = 0;
          words.forEach(w => {
            if (w.length > 3 && doc.content.toLowerCase().includes(w)) score += 2;
          });
          if (score > highestScore) {
            highestScore = score;
            bestMatch = doc;
          }
        });

        if (!bestMatch || highestScore === 0) {
          return { 
            text: ">> No se detectaron coincidencias exactas para esa consulta en los manuales indexados. Prueba buscando conceptos específicos (ej: nomenclatura, óxidos, seguridad, epp).", 
            doc: null 
          };
        }

        // Extraemos un fragmento relevante alrededor de la primera coincidencia clave
        const contentLower = bestMatch.content.toLowerCase();
        const firstWord = qLower.split(/\s+/).find(w => w.length > 3) || "";
        let index = contentLower.indexOf(firstWord);
        if (index === -1) index = 0;

        const snippet = bestMatch.content.substring(index, index + 350).replace(/\s+/g, ' ').trim();

        const responseText = `>> COINCIDENCIA ENCONTRADA\n\n"${snippet}..."`;
        return { text: responseText, doc: bestMatch };
      }

      function handleQuerySubmission() {
        const val = $('#queryInput').value.trim();
        if (!val) return;
        
        appendMessage(val, 'user');
        $('#queryInput').value = '';
        $('#sendBtn').disabled = true;

        setTimeout(() => {
          const result = processQuery(val);
          const aiMsg = appendMessage(result.text, 'ai');

          // Si encontró un documento relacionado, le inyectamos la tarjeta interactiva con el botón para abrir el PDF
          if (result.doc) {
            const card = document.createElement('div');
            card.className = 'doc-action-card';
            card.innerHTML = `
              <div class="doc-action-title">📄 ARCHIVO FUENTE: ${result.doc.name}</div>
              <a href="${result.doc.fileRef}" target="_blank" rel="noopener" class="open-btn">
                <span>📂</span> ABRIR PDF ORIGINAL
              </a>
            `;
            aiMsg.appendChild(card);
          }

          const box = $('#chatBox');
          box.scrollTop = box.scrollHeight;
          $('#sendBtn').disabled = false;
          $('#queryInput').focus();
        }, 400);
      }

      $('#sendBtn').addEventListener('click', handleQuerySubmission);
      $('#queryInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleQuerySubmission();
      });

      discoverAndIndexFiles();
    })();
  </script>
 </body>
</html>
