<!doctype html>
<html lang="es">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS-X // Hibrid RAG Core</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <style>
    :root{
      --bg:#02040a; --panel:rgba(8, 15, 28, 0.85); --stroke:rgba(0, 242, 254, 0.25);
      --text:#e2e8f0; --muted:#64748b; --accent:#00f2fe; --accent2:#4facfe;
      --success:#39ff88; --mono:ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; font-family:var(--mono); color:var(--text); background:var(--bg);
      background-image: linear-gradient(rgba(0,242,254,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,242,254,0.03) 1px, transparent 1px);
      background-size: 30px 30px; min-height:100vh; display:flex; flex-direction:column;
    }
    header{
      padding:16px 24px; border-bottom:1px solid var(--stroke); background:var(--panel);
      display:flex; justify-content:space-between; align-items:center; backdrop-filter:blur(10px);
    }
    .logo{font-size:14px; font-weight:bold; letter-spacing:2px; color:var(--accent); text-shadow:0 0 10px rgba(0,242,254,0.4);}
    .status{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:8px;}
    .pulse{width:6px; height:6px; background:var(--accent); border-radius:50%; box-shadow:0 0 8px var(--accent); animation:blink 1.5s infinite;}
    @keyframes blink{0%{opacity:1;} 50%{opacity:0.2;} 100%{opacity:1;}}

    .container{max-width:1000px; width:94vw; margin:24px auto; flex:1; display:flex; flex-direction:column; gap:16px;}
    
    .chat-box{
      flex:1; background:var(--panel); border:1px solid var(--stroke); border-radius:12px;
      padding:20px; overflow-y:auto; max-height:65vh; min-height:420px; display:flex; flex-direction:column; gap:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.8);
    }
    .msg{padding:14px 18px; border-radius:8px; font-size:13px; line-height:1.6; max-width:88%; white-space: pre-line;}
    .msg.system{background:rgba(0,242,254,0.04); border:1px solid rgba(0,242,254,0.2); color:var(--accent); align-self:flex-start;}
    .msg.user{background:rgba(79,172,254,0.1); border:1px solid rgba(79,172,254,0.3); color:#fff; align-self:flex-end;}
    .msg.ai{background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); color:#cbd5e1; align-self:flex-start;}
    .msg.error{background:rgba(255,85,119,0.05); border:1px solid rgba(255,85,119,0.3); color:#ff9bad; align-self:flex-start;}

    .doc-action-card{
      margin-top:12px; padding:12px; background:rgba(57,255,136,0.03); border:1px solid rgba(57,255,136,0.25);
      border-radius:6px; display:flex; flex-direction:column; gap:8px;
    }
    .doc-action-title{color:var(--success); font-size:11px; font-weight:bold;}
    .open-btn{
      display:inline-flex; align-items:center; gap:8px; padding:8px 14px; background:linear-gradient(135deg, var(--accent), var(--accent2));
      color:#000; text-decoration:none; border-radius:6px; font-weight:bold; font-size:11px; width:fit-content; cursor:pointer;
      box-shadow:0 0 10px rgba(0,242,254,0.3); transition:transform 0.1s; border:none;
    }
    .open-btn:hover{transform:translateY(-1px); box-shadow:0 0 15px rgba(0,242,254,0.6);}

    #pdfViewerModal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 4, 10, 0.9); z-index: 1000; backdrop-filter: blur(8px);
      flex-direction: column; padding: 20px;
    }
    .viewer-header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--panel); border: 1px solid var(--stroke); padding: 10px 20px;
      border-radius: 8px 8px 0 0; font-size: 13px; color: var(--accent);
    }
    .close-viewer {
      background: #ff5577; color: #fff; border: none; padding: 6px 12px;
      border-radius: 4px; cursor: pointer; font-family: var(--mono); font-weight: bold; font-size: 11px;
    }
    .viewer-body {
      flex: 1; background: #0b1329; border: 1px solid var(--stroke); border-top: none;
      border-radius: 0 0 8px 8px; overflow: auto; display: flex; justify-content: center; padding: 20px;
    }
    canvas { max-width: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.8); background: white; }

    .input-panel{
      background:var(--panel); border:1px solid var(--stroke); border-radius:12px; padding:12px;
      display:flex; gap:12px; align-items:center;
    }
    .input-panel input{
      flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:var(--mono); font-size:14px;
    }
    .btn{
      background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#000; border:none;
      padding:10px 20px; border-radius:6px; font-weight:bold; font-family:var(--mono); font-size:12px; cursor:pointer;
      transition:transform 0.1s, box-shadow 0.2s;
    }
    .btn:disabled{opacity:0.5; cursor:not-allowed;}
    .btn:hover:not(:disabled){box-shadow:0 0 15px rgba(0,242,254,0.5); transform:translateY(-1px);}
  </style>
 </head>
 <body>
  <header>
   <div class="logo">NEXUS-X // HYBRID RAG CORE</div>
   <div class="status"><div class="pulse"></div><span id="sysState">Verificando sistema...</span></div>
  </header>

  <div class="container">
   <div class="chat-box" id="chatBox">
    <div class="msg system">>> NEXUS-X Híbrido inicializado. Comprobando memoria interna...</div>
   </div>

   <div class="input-panel">
    <input id="queryInput" type="text" placeholder="Escribe tu consulta técnica..." autocomplete="off" disabled>
    <button class="btn" id="sendBtn" disabled>CONSULTAR</button>
   </div>
  </div>

  <div id="pdfViewerModal">
    <div class="viewer-header">
      <span id="viewerTitle">📄 Lector Interno - Documento</span>
      <button class="close-viewer" id="closeViewerBtn">CERRAR [X]</button>
    </div>
    <div class="viewer-body" id="viewerCanvasContainer">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      let repository = [];
      const $ = (s) => document.querySelector(s);

      // Abrir base de datos local (el "tarrito" de descargas IndexedDB)
      function openDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open("NexusXHybridDB", 1);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains("docs")) {
              db.createObjectStore("docs", { keyPath: "id" });
            }
          };
        });
      }

      async function saveDocsToCache(docs) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction("docs", "readwrite");
          const store = transaction.objectStore("docs");
          docs.forEach(doc => store.put(doc));
          transaction.oncomplete = () => resolve();
          transaction.onerror = () => reject(transaction.error);
        });
      }

      async function getAllDocsFromCache() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction("docs", "readonly");
          const store = transaction.objectStore("docs");
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      async function initializeSystem() {
        // 1. Intentar cargar primero lo que ya está guardado en el tarrito local
        let cachedDocs = [];
        try {
          cachedDocs = await getAllDocsFromCache();
        } catch (e) {
          console.log("Tarrito local vacío o no disponible.");
        }

        if (cachedDocs && cachedDocs.length > 0) {
          repository = cachedDocs;
          $('#sysState').textContent = `Modo Offline/Local (${repository.length} docs en tarrito)`;
          enableApp(`>> Sistema operativo. Usando ${repository.length} manuales almacenados en la memoria interna.`);
        }

        // 2. Si hay internet, intentar buscar actualizaciones o bajar nuevos archivos en segundo plano
        if (navigator.onLine) {
          try {
            $('#sysState').textContent = "Sincronizando con la nube...";
            
            // Intentamos leer el listado automático que genera GitHub Pages en el directorio raíz
            const res = await fetch('./');
            if (res.ok) {
              const htmlText = await res.text();
              const parser = new DOMParser();
              const docHtml = parser.parseFromString(htmlText, 'text/html');
              
              // Extraemos todos los links que terminen en .pdf de la página del repositorio
              const links = Array.from(docHtml.querySelectorAll('a'))
                .map(a => a.getAttribute('href'))
                .filter(href => href && href.toLowerCase().endsWith('.pdf'));

              let downloadedCount = 0;
              for (const pdfLink of links) {
                // Si ya lo tenemos y pesa igual, podemos saltarlo o refrescarlo
                const fileName = decodeURIComponent(pdfLink.split('/').pop());
                
                try {
                  const pdfRes = await fetch(pdfLink);
                  if (!pdfRes.ok) continue;
                  const arrayBuffer = await pdfRes.arrayBuffer();

                  const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                  const pdfDoc = await loadingTask.promise;
                  let text = "";
                  const maxPages = Math.min(pdfDoc.numPages, 15);
                  for (let i = 1; i <= maxPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const content = await page.getTextContent();
                    text += " " + content.items.map(item => item.str).join(" ");
                  }

                  const docObj = {
                    id: fileName,
                    name: fileName,
                    blobData: arrayBuffer,
                    content: text
                  };

                  // Guardar en el tarrito local
                  await saveDocsToCache([docObj]);
                  
                  // Actualizar memoria RAM activa
                  const existingIndex = repository.findIndex(d => d.id === fileName);
                  if (existingIndex >= 0) {
                    repository[existingIndex] = docObj;
                  } else {
                    repository.push(docObj);
                  }
                  downloadedCount++;
                } catch (err) {
                  console.warn(`No se pudo descargar ${fileName}`);
                }
              }

              if (downloadedCount > 0 && repository.length > 0) {
                $('#sysState').textContent = "Sincronizado (Online)";
                appendMessage(`>> Sincronización completada. ${downloadedCount} manuales actualizados/guardados en el tarrito.`, 'system');
              }
            }
          } catch (netErr) {
            console.log("Fallo de red secundario, operando con caché local.");
          }
        }

        if (repository.length === 0) {
          $('#sysState').textContent = "Sin red / Sin caché";
          appendMessage(`>> ADVERTENCIA: La memoria interna está vacía y no hay internet. Conectá la netbook unos minutos para bajar los manuales por primera vez.`, "error");
        }
      }

      function enableApp(systemMsg) {
        $('#queryInput').disabled = false;
        $('#sendBtn').disabled = false;
        if (systemMsg) appendMessage(systemMsg, 'system');
      }

      function appendMessage(text, sender) {
        const box = $('#chatBox');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
      }

      // Buscador flexible por palabras sueltas en la memoria local
      function processQuery(query) {
        if (repository.length === 0) return { text: ">> Sin documentos en la memoria local.", doc: null };

        const qLower = query.toLowerCase();
        const searchWords = qLower.split(/\s+/).filter(w => w.length > 2);
        
        if (searchWords.length === 0) return { text: ">> Escribe palabras clave más largas para realizar la búsqueda.", doc: null };

        let bestMatch = null;
        let highestScore = 0;

        repository.forEach(doc => {
          let score = 0;
          const contentLower = doc.content.toLowerCase();
          
          searchWords.forEach(word => {
            const regex = new RegExp(word, 'g');
            const matches = contentLower.match(regex);
            if (matches) {
              score += matches.length * 2;
            }
          });

          if (score > highestScore) {
            highestScore = score;
            bestMatch = doc;
          }
        });

        if (!bestMatch || highestScore === 0) {
          return { text: ">> No se encontraron coincidencias para esas palabras en los manuales indexados.", doc: null };
        }

        const contentLower = bestMatch.content.toLowerCase();
        let index = contentLower.indexOf(searchWords[0]);
        if (index === -1) index = 0;
        const start = Math.max(0, index - 60);
        const snippet = bestMatch.content.substring(start, start + 350).replace(/\s+/g, ' ').trim();

        return { text: `>> COINCIDENCIA ENCONTRADA (Puntaje: ${highestScore})\n\n"...${snippet}..."`, doc: bestMatch };
      }

      function handleQuerySubmission() {
        const val = $('#queryInput').value.trim();
        if (!val) return;
        
        appendMessage(val, 'user');
        $('#queryInput').value = '';
        $('#sendBtn').disabled = true;

        setTimeout(() => {
          const result = processQuery(val);
          const aiMsg = appendMessage(result.text, 'ai');

          if (result.doc) {
            const card = document.createElement('div');
            card.className = 'doc-action-card';
            card.innerHTML = `
              <div class="doc-action-title">📄 ARCHIVO FUENTE: ${result.doc.name}</div>
              <button class="open-btn">
                <span>📂</span> ABRIR DESDE EL TARRITO LOCAL
              </button>
            `;
            aiMsg.appendChild(card);
            
            card.querySelector('.open-btn').addEventListener('click', () => {
              openOfflinePDFViewer(result.doc);
            });
          }

          const box = $('#chatBox');
          box.scrollTop = box.scrollHeight;
          $('#sendBtn'].disabled = false;
          $('#queryInput').focus();
        }, 100);
      }

      async function openOfflinePDFViewer(doc) {
        $('#viewerTitle').textContent = `📄 Lector Interno - ${doc.name}`;
        $('#pdfViewerModal').style.display = 'flex';

        try {
          const loadingTask = pdfjsLib.getDocument({ data: doc.blobData });
          const pdfDoc = await loadingTask.promise;
          const page = await pdfDoc.getPage(1);

          const canvas = document.getElementById('pdfCanvas');
          const context = canvas.getContext('2d');
          const viewport = page.getViewport({ scale: 1.5 });

          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;
        } catch (e) {
          console.error("Error al renderizar el PDF:", e);
        }
      }

      $('#closeViewerBtn').addEventListener('click', () => {
        $('#pdfViewerModal').style.display = 'none';
      });

      $('#sendBtn').addEventListener('click', handleQuerySubmission);
      $('#queryInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleQuerySubmission();
      });

      initializeSystem();
    })();
  </script>
 </body>
</html>
