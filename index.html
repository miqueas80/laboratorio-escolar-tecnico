<!doctype html>
<html lang="es">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS-X // Autonomous RAG Core</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <style>
    :root{
      --bg:#02040a; --panel:rgba(8, 15, 28, 0.85); --stroke:rgba(0, 242, 254, 0.25);
      --text:#e2e8f0; --muted:#64748b; --accent:#00f2fe; --accent2:#4facfe;
      --mono:ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; font-family:var(--mono); color:var(--text); background:var(--bg);
      background-image: linear-gradient(rgba(0,242,254,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,242,254,0.03) 1px, transparent 1px);
      background-size: 30px 30px; min-height:100vh; display:flex; flex-direction:column;
    }
    header{
      padding:16px 24px; border-bottom:1px solid var(--stroke); background:var(--panel);
      display:flex; justify-content:space-between; align-items:center; backdrop-filter:blur(10px);
    }
    .logo{font-size:14px; font-weight:bold; letter-spacing:2px; color:var(--accent); text-shadow:0 0 10px rgba(0,242,254,0.4);}
    .status{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:8px;}
    .pulse{width:6px; height:6px; background:var(--accent); border-radius:50%; box-shadow:0 0 8px var(--accent); animation:blink 1.5s infinite;}
    @keyframes blink{0%{opacity:1;} 50%{opacity:0.2;} 100%{opacity:1;}}

    .container{max-width:1000px; width:94vw; margin:24px auto; flex:1; display:flex; flex-direction:column; gap:16px;}
    
    .chat-box{
      flex:1; background:var(--panel); border:1px solid var(--stroke); border-radius:12px;
      padding:20px; overflow-y:auto; max-height:55vh; min-height:350px; display:flex; flex-direction:column; gap:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.8);
    }
    .msg{padding:12px 16px; border-radius:8px; font-size:13px; line-height:1.5; max-width:85%; white-space: pre-line;}
    .msg.system{background:rgba(0,242,254,0.05); border:1px solid rgba(0,242,254,0.2); color:var(--accent); align-self:flex-start;}
    .msg.user{background:rgba(79,172,254,0.1); border:1px solid rgba(79,172,254,0.3); color:#fff; align-self:flex-end;}
    .msg.ai{background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); color:#cbd5e1; align-self:flex-start;}
    .msg.error{background:rgba(255,85,119,0.05); border:1px solid rgba(255,85,119,0.3); color:#ff9bad; align-self:flex-start;}

    .input-panel{
      background:var(--panel); border:1px solid var(--stroke); border-radius:12px; padding:12px;
      display:flex; gap:12px; align-items:center;
    }
    .input-panel input{
      flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:var(--mono); font-size:14px;
    }
    .btn{
      background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#000; border:none;
      padding:10px 20px; border-radius:6px; font-weight:bold; font-family:var(--mono); font-size:12px; cursor:pointer;
      transition:transform 0.1s, box-shadow 0.2s;
    }
    .btn:hover{box-shadow:0 0 15px rgba(0,242,254,0.5); transform:translateY(-1px);}

    .docs-loaded{font-size:11px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
    .doc-pill{
      background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); padding:6px 12px; border-radius:6px;
      color:var(--text); text-decoration:none; display:inline-flex; align-items:center; gap:8px; cursor:pointer; transition:border-color 0.2s, background 0.2s;
    }
    .doc-pill:hover{border-color:var(--accent); background:rgba(0,242,254,0.08);}
  </style>
 </head>
 <body>
  <header>
   <div class="logo">NEXUS-X // LOCAL RAG KERNEL</div>
   <div class="status"><div class="pulse"></div><span id="sysState">Escaneando repositorio en GitHub...</span></div>
  </header>

  <div class="container">
   <div class="docs-loaded" id="docsList">
    <span style="color:var(--accent)">Repositorios indexados:</span>
   </div>

   <div class="chat-box" id="chatBox">
    <div class="msg system">>> NEXUS-X Core inicializado. Buscando documentos automáticamente en el repositorio...</div>
   </div>

   <div class="input-panel">
    <input id="queryInput" type="text" placeholder="Escribe tu consulta técnica sobre los documentos..." autocomplete="off">
    <button class="btn" id="sendBtn">CONSULTAR</button>
   </div>
  </div>

  <script>
    (() => {
      'use strict';

      const GITHUB_CONFIG = {
        owner: "miqueas80",
        repo: "laboratorio-escolar-tecnico",
        branch: "main"
      };

      let repository = [];
      const $ = (s) => document.querySelector(s);

      async function extractPDF(url) {
        try {
          const task = pdfjsLib.getDocument(url);
          const doc = await task.promise;
          let text = "";
          for (let i = 1; i <= doc.numPages; i++) {
            const page = await doc.getPage(i);
            const content = await page.getTextContent();
            text += " " + content.items.map(item => item.str).join(" ");
          }
          return text;
        } catch(e) {
          console.warn("Error leyendo PDF:", url);
          return "";
        }
      }

      async function discoverAndIndexFiles() {
        const listEl = $('#docsList');
        const treeUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/git/trees/${GITHUB_CONFIG.branch}?recursive=1`;

        try {
          const res = await fetch(treeUrl);
          if (!res.ok) throw new Error("No se pudo conectar con la API de GitHub.");
          const data = await res.json();
          
          const pdfFiles = (data.tree || []).filter(item => item.type === "blob" && item.path.toLowerCase().endsWith('.pdf'));

          if (pdfFiles.length === 0) {
            $('#sysState').textContent = "No se encontraron PDFs";
            appendMessage(">> ADVERTENCIA: No se detectaron archivos .pdf en el repositorio de GitHub.", "error");
            return;
          }

          $('#sysState').textContent = `Procesando ${pdfFiles.length} documentos...`;

          for (const file of pdfFiles) {
            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${file.path}`;
            const githubViewUrl = `https://github.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/blob/${GITHUB_CONFIG.branch}/${file.path}`;
            const fileName = file.path.split('/').pop();

            $('#sysState').textContent = `Extrayendo: ${fileName}`;
            const textContent = await extractPDF(rawUrl);

            repository.push({
              id: file.path,
              name: fileName,
              fileRef: githubViewUrl,
              content: textContent
            });

            listEl.innerHTML += `
              <a href="${githubViewUrl}" target="_blank" rel="noopener" class="doc-pill">
                <span>📄</span> ${fileName} 
                <span style="font-size:10px; color:var(--accent);">[ABRIR]</span>
              </a>`;
          }

          $('#sysState').textContent = "Núcleo neural operativo al 100%";
          appendMessage(`>> Sincronización exitosa. Se indexaron ${repository.length} documentos automáticamente desde GitHub.`, "system");

        } catch (err) {
          $('#sysState').textContent = "Error de indexación";
          appendMessage(`>> Error al escanear GitHub: ${err.message}. Comprueba tu conexión o que el repositorio sea público.`, "error");
        }
      }

      function appendMessage(text, sender) {
        const box = $('#chatBox');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      }

      function processQuery(query) {
        if (repository.length === 0) {
          return ">> No hay documentos indexados en este momento para procesar la consulta.";
        }

        const qLower = query.toLowerCase();
        let bestMatch = null;
        let highestScore = 0;

        repository.forEach(doc => {
          const words = qLower.split(/\s+/);
          let score = 0;
          words.forEach(w => {
            if (w.length > 3 && doc.content.toLowerCase().includes(w)) score++;
          });
          if (score > highestScore) {
            highestScore = score;
            bestMatch = doc;
          }
        });

        if (!bestMatch || highestScore === 0) {
          return ">> No se detectaron coincidencias directas en los PDFs indexados. Prueba usando palabras clave más específicas que aparezcan en los manuales.";
        }

        const contentSample = doc.content ? bestMatch.content.substring(0, 400).replace(/\s+/g, ' ').trim() : "Contenido no disponible.";
        return `>> [COINCIDENCIA ENCONTRADA EN: ${bestMatch.name}]\n\n"${contentSample}..."\n\n[Acción: Haz clic arriba en el botón del archivo "${bestMatch.name}" para ver el documento completo].`;
      }

      $('#sendBtn').addEventListener('click', () => {
        const val = $('#queryInput').value.trim();
        if (!val) return;
        appendMessage(val, 'user');
        $('#queryInput').value = '';

        setTimeout(() => {
          const response = processQuery(val);
          appendMessage(response, 'ai');
        }, 300);
      });

      $('#queryInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') $('#sendBtn').click();
      });

      discoverAndIndexFiles();
    })();
  </script>
 </body>
</html>
